version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: classifiedhub-postgres
    environment:
      POSTGRES_DB: classifiedhub
      POSTGRES_USER: classifiedhub_user
      POSTGRES_PASSWORD: classifiedhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - classifiedhub-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: classifiedhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - classifiedhub-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classifiedhub-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://classifiedhub_user:classifiedhub_password@postgres:5432/classifiedhub
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - classifiedhub-network
    command: npm run dev

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: classifiedhub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - classifiedhub-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  classifiedhub-network:
    driver: bridge 